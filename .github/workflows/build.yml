name: Build FastTap APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Files
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/fasttap/app

          [ -f index.html ] && cp index.html app/src/main/assets/index.html || true
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f MainActivity.kt ] && cp MainActivity.kt app/src/main/java/com/fasttap/app/MainActivity.kt || true

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.fasttap.app'
              compileSdk 33

              defaultConfig {
                  applicationId "com.fasttap.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'com.google.android.gms:play-services-ads:22.3.0'
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --continue || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastTap-APK
          path: app/build/outputs/apk/debug/app-debug.apk
